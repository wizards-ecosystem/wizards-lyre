[project]
name = "wizards-lyre"
version = "0.1.0"
description = "Local ACE-Step 1.5 generative music studio. Runs entirely on your own GPU."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wizard's Conclave" }]
keywords = ["music", "generative", "ace-step", "local-first", "audio", "diffusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/wizards-ecosystem/wizards-lyre"
Repository = "https://github.com/wizards-ecosystem/wizards-lyre"
Issues = "https://github.com/wizards-ecosystem/wizards-lyre/issues"
Changelog = "https://github.com/wizards-ecosystem/wizards-lyre/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["server", "worker", "scripts"]
# Deliberately not --strict: this codebase annotates its own boundaries well
# but passes plain dicts around internally (plan.json, meta.json, job payloads
# are JSON documents, not models), and forcing TypedDicts on those would add
# noise without catching anything the tests do not.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Upstream ACE-Step ships no type information. The worker adapter imports it
# lazily inside functions and wraps every call, so a signature drift surfaces
# as WorkerUnavailable naming the failed step -- see
# tests/test_acestep_worker_adapter.py, which pins the real call shapes.
module = ["acestep.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["server", "worker"]
branch = true

[tool.coverage.report]
# The suite currently sits just above 90%. The floor is set a little below
# that so an unrelated change does not fail CI over rounding, while a real
# drop -- a new module arriving untested -- still does. Raise it when the
# number moves up and stays there.
fail_under = 88
show_missing = true
exclude_also = [
    # The real ACE-Step import paths only execute with the GPU stack present,
    # which CI deliberately does not install.
    "raise WorkerUnavailable",
    "if TYPE_CHECKING:",
    "if sys.platform == \"win32\":",
]

[tool.ruff]
# Matches the width the existing code was written to.
line-length = 100
target-version = "py311"
extend-exclude = ["vendor", "checkpoints", "projects", "output"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # `try/except/pass` in this codebase always carries a comment explaining
    # what is being tolerated and why; contextlib.suppress hides that comment
    # behind a context manager without making the intent any clearer.
    "SIM105",
    # Several __all__ lists group the deliberately re-exported private helpers
    # first, under a comment saying why they are there. Alphabetizing the two
    # groups together would lose that.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# Each package __init__ exists to re-export its modules' public surface.
"server/storage/__init__.py" = ["F401"]
"server/jobs/__init__.py" = ["F401"]
"worker/acestep_worker/__init__.py" = ["F401"]
# `file: UploadFile = File(...)` is FastAPI's declaration syntax, not a real
# mutable default.
"server/app.py" = ["B008"]
# Test doubles for upstream ACE-Step classes mirror their real shapes, class
# attributes included.
"tests/*" = ["RUF012"]
