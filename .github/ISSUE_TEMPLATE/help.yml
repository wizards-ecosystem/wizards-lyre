name: Setup or usage question
description: Ask for help installing or using The Wizard's Lyre
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [Installation](https://github.com/wizards-ecosystem/wizards-lyre/blob/main/docs/INSTALLATION.md)
        and [Troubleshooting](https://github.com/wizards-ecosystem/wizards-lyre/blob/main/docs/TROUBLESHOOTING.md)
        first. Search existing issues too; another user may already have the answer.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Include what you tried and where you became stuck.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `./scripts/lyre doctor`
      description: Remove personal paths or project names if needed.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the smallest server or worker log excerpt that shows the problem.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: >-
            I removed credentials, personal paths, private audio, model weights,
            and generated projects
          required: true
