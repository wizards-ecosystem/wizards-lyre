name: Feature request
description: Suggest something for Lyre
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Please check the scope first.** Lyre has a narrow product boundary.
        [SPEC.md section 2](https://github.com/wizards-ecosystem/wizards-lyre/blob/main/SPEC.md)
        permanently excludes:

        - Generation engines other than ACE-Step 1.5, including Suno/Udio
          wrappers, Lyria, ElevenLabs, Stability, Magenta, LeVo, and YuE
        - A full DAW: mixer, MIDI piano roll, VST/AU plugins, automation lanes
        - Authentication, multi-user, reverse proxy, Docker, or cloud GPU
        - Shipping ACE-Step's Gradio UI

        Requests for these will be closed because they define a different
        product. Forks may pursue them under the MIT license.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the solution. What does your workflow look like today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read SPEC.md section 2 and this request is within scope
          required: true
