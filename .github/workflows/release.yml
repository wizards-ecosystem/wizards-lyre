name: Release

on:
  push:
    tags:
      - "v*"

# Tag builds stay GPU- and ACE-Step-free. The downloadable runtime fetches the
# pinned upstream source and selected model weights during installation.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install source dependencies
        run: |
          uv sync --extra dev --no-install-project --locked
          npm ci --prefix web

      - name: Verify Python source
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy
          uv run --no-sync reuse lint
          uv run --no-sync python -m pytest --cov
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt \
            | uv run --no-sync pip-audit -r /dev/stdin
          uv build

      - name: Verify and build web app
        run: |
          npm audit --audit-level=moderate --prefix web
          npm run lint --prefix web
          npm test --prefix web
          npm run build --prefix web

      - name: Verify launcher
        run: shellcheck scripts/lyre

      - name: Build reproducible runtime archives
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          uv run --no-sync python scripts/build_release.py --version "$RELEASE_VERSION"
          (cd dist/release && sha256sum --check SHA256SUMS)

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Refusing to replace assets on a published release." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "The Wizard's Lyre ${RELEASE_TAG#v}"
          fi
