name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here is GPU-free and ACE-Step-free. Nothing under server/, worker/,
# or tests/ imports acestep or torch at module scope, and the adapter test
# installs its own fake acestep.* modules, so CI needs only the declared
# dependencies -- not the model weights and not the vendored upstream clone.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --no-install-project --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync reuse lint

      - name: Type-check
        run: uv run --no-sync mypy

      - name: Audit runtime dependencies
        if: matrix.python-version == '3.12'
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt \
            | uv run --no-sync pip-audit -r /dev/stdin

      - name: Test
        run: uv run --no-sync python -m pytest --cov

      - name: Build source artifacts
        if: matrix.python-version == '3.12'
        run: uv build

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --prefix web

      - name: Lint and type-check
        run: npm run lint --prefix web

      - name: Test
        run: npm test --prefix web

      - name: Build
        run: npm run build --prefix web

      - name: Smoke-test release packaging
        run: |
          python3 scripts/build_release.py --output-dir dist/release-test
          (cd dist/release-test && sha256sum --check SHA256SUMS)

  launcher:
    name: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: shellcheck scripts/lyre
